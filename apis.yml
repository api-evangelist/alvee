name: Alvee Health
description: Alvee Health is an AI-powered care navigation platform for social determinants
  of health (SDOH) and whole-person care coordination. It surfaces unmet social and
  clinical needs from documentation, auto-codes Z-codes, automates patient outreach
  and benefits enrollment through an autonomous care navigator, generates compliant
  billing documentation, and tracks outcomes so providers can capture reimbursement
  for CHI, PIN, CCM, PCM, and G0136 care-coordination codes. The platform is HIPAA
  compliant and SMART on FHIR certified, integrating with EHRs to embed social drivers
  of health into clinical workflows. Alvee is a Techstars Iowa (2022) portfolio company.
